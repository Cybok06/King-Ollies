<div class="modal fade data-purchase-modal" id="dataPurchaseModal" tabindex="-1" aria-labelledby="dataPurchaseTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><div><small class="data-purchase-eyebrow">DATA BUNDLES</small><h5 class="modal-title" id="dataPurchaseTitle">Buy data</h5></div><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div id="dataPurchaseEditor">
          <div class="data-purchase-tabs" role="tablist" aria-label="Order type">
            <button type="button" id="dataSingleTab" role="tab" aria-selected="true" aria-controls="dataSinglePanel" class="active">Single Order</button>
            <button type="button" id="dataBulkTab" role="tab" aria-selected="false" aria-controls="dataBulkPanel" tabindex="-1">Bulk Order</button>
          </div>
          <div id="dataSinglePanel" role="tabpanel" aria-labelledby="dataSingleTab"><label class="form-label" for="dataPurchasePhone">Recipient phone number</label><input id="dataPurchasePhone" class="form-control" type="tel" inputmode="numeric" autocomplete="tel" placeholder="e.g. 0241234567" maxlength="10"><p class="data-purchase-help">Enter a Ghana number starting with 0 (10 digits).</p></div>
          <div id="dataBulkPanel" role="tabpanel" aria-labelledby="dataBulkTab" hidden><label class="form-label" for="dataPurchasePhones">Recipient phone numbers</label><textarea id="dataPurchasePhones" class="form-control" rows="5" placeholder="0241234567&#10;0201234567"></textarea><p class="data-purchase-help">One number per line. The selected offer applies to every recipient.</p></div>
          <label class="form-label" for="dataPurchaseOffer">Select offer</label><select id="dataPurchaseOffer" class="form-select"></select>
          <div class="data-purchase-summary"><span id="dataPurchaseCount">1 recipient</span><strong>GHS <span id="dataPurchaseTotal">0.00</span></strong></div>
          <p class="data-purchase-help" id="dataPurchaseMethod"></p>
          <button type="button" class="btn btn-primary w-100" id="dataPurchasePay">Pay Now</button>
        </div>
        <div id="dataPurchaseResult" class="data-purchase-result" hidden><i class="bi bi-check-circle" id="dataPurchaseResultIcon" aria-hidden="true"></i><h5 id="dataPurchaseResultTitle">Order successfully placed</h5><p id="dataPurchaseResultMessage"></p><a class="btn btn-primary w-100 mb-2" id="dataPurchaseReceipt">View Receipt</a><button type="button" class="btn btn-outline-light w-100" data-bs-dismiss="modal">Close</button><div id="dataPurchaseFirstTimeNote" class="small mt-3 text-muted" hidden><i class="bi bi-info-circle me-1" aria-hidden="true"></i>First time purchase might take 24hrs</div></div>
        <p id="dataPurchaseError" class="data-purchase-error" role="alert" hidden></p>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/data-purchase.js') }}" defer></script>
